<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Junior League — детская футбольная лига Челябинска: таблицы, расписание, составы"><script src="config.js"></script><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style></head><body><title>Junior League</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="css">
@import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Golos+Text:wght@400;500;600&display=swap');
/* Minimal sheet in the league's own colours: navy ink on white, orange only for state and emphasis. */
:root{
  --bg:#FFFFFF; --soft:#F3F6FA; --ink:#011D42; --muted:#5B6C86; --line:#E3E9F2;
  --accent:#FF8302; --on-accent:#011D42; --btn:#011D42; --on-btn:#FFFFFF;
  --logo-nv:#011D42; --logo-wh:var(--bg);
  --win:#0B7A4B; --win-bg:#E5F5EC; --draw:#5B6C86; --draw-bg:#EEF2F8; --loss:#B3261E; --loss-bg:#FBE9E7;
  --bar-bg:#011D42; --bar-fg:#FFFFFF; --shadow:0 14px 34px rgba(1,29,66,.14); --scrim:rgba(1,29,66,.55);
  --display:'Exo 2','Arial Narrow',system-ui,sans-serif; --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
@media all{
  :root:not([data-theme="light"]){
    --bg:#010F26; --soft:#0A2249; --ink:#F2F5FA; --muted:#9BAAC4; --line:#15305A;
    --btn:#FF8302; --on-btn:#011D42; --logo-nv:#FFFFFF;
    --win:#5FD39A; --win-bg:#0F3A2B; --draw:#A9B7CD; --draw-bg:#12294D; --loss:#FF9188; --loss-bg:#3E1E24;
    --bar-bg:#0A2249; --bar-fg:#F2F5FA; --shadow:0 14px 34px rgba(0,0,0,.5); --scrim:rgba(0,6,18,.72); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#010F26; --soft:#0A2249; --ink:#F2F5FA; --muted:#9BAAC4; --line:#15305A;
  --btn:#FF8302; --on-btn:#011D42; --logo-nv:#FFFFFF;
  --win:#5FD39A; --win-bg:#0F3A2B; --draw:#A9B7CD; --draw-bg:#12294D; --loss:#FF9188; --loss-bg:#3E1E24;
  --bar-bg:#0A2249; --bar-fg:#F2F5FA; --shadow:0 14px 34px rgba(0,0,0,.5); --scrim:rgba(0,6,18,.72); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-block:22px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.mo{overflow:hidden}
.wrap{max-width:920px;margin:0 auto}
.defs{position:absolute;width:0;height:0;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
.muted{color:var(--muted)}

/* animation */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes slide{from{transform:translateY(100%)}}
.rv{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.noanim .rv{animation:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:block;height:54px;width:auto;aspect-ratio:118180/49482}
.pill{display:inline-block;background:var(--accent);color:var(--on-accent);font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.edit-note{color:var(--muted);font-size:13px;margin-top:10px}
.cap{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:28px 0 8px}
.leagues{display:flex;gap:6px 26px;flex-wrap:wrap}
.lg{position:relative;background:none;border:0;padding:2px 0 7px;font:italic 800 30px/1.1 var(--display);color:var(--muted);cursor:pointer;transition:color .2s}
.lg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.lg:hover,.lg[aria-current="true"]{color:var(--ink)}
.lg:hover::after,.lg[aria-current="true"]::after{transform:scaleX(1)}
.sum{color:var(--muted);font-size:13px;margin-top:8px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:18px 0 24px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 0;font:600 15px var(--body);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* table + chess board */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:12px 6px;text-align:center;white-space:nowrap}
th{font:500 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.09em;border-bottom:1px solid var(--ink)}
tbody td{border-bottom:1px solid var(--line)}
tbody tr:hover td{background:var(--soft)}
th.team,td.team{text-align:left;white-space:normal;min-width:130px}
td.team{font-weight:500}
td.pl{width:44px}
td.pl span{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;font:italic 800 16px var(--display)}
tr.lead td.pl span{background:var(--accent);color:var(--on-accent)}
td.pts{font:italic 800 20px var(--display)}
.tl{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;text-decoration-thickness:2px;transition:text-decoration-color .2s}
.tl:hover{text-decoration-color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin-top:12px;max-width:65ch}
.chess th{padding:10px 4px;min-width:46px}
.chess td{padding:4px}
.chess th.team,.chess td.rh{min-width:150px;max-width:180px}
.chess td.rh{text-align:left;white-space:normal;position:sticky;left:0;background:var(--bg);z-index:1}
.chess td.rh b{font:italic 800 14px var(--display);color:var(--muted);margin-right:8px}
.chess td.self{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,var(--bg) 6px 12px)}
.g{display:block;font:500 13px var(--body);padding:2px 4px;border-radius:6px;margin:1px 0;min-width:40px}
.g.w{background:var(--win-bg);color:var(--win)}
.g.d,.g.n{background:var(--draw-bg);color:var(--draw)}
.g.l{background:var(--loss-bg);color:var(--loss)}

/* matches */
.bar{display:flex;gap:8px;margin-bottom:16px}
.tour{margin-bottom:36px}
.th{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:12px}
.th h3{font:italic 800 30px/1 var(--display)}
.th .meta{color:var(--muted);font-size:13px}
details.parts{margin:0 0 10px;color:var(--muted);font-size:14px}
details.parts summary{cursor:pointer;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 12px;padding:10px 0;border-top:1px solid var(--line)}
.slot.nt{grid-template-columns:minmax(0,1fr)}
.slot h4{font:italic 700 18px var(--display);color:var(--muted);padding-top:8px}
.m{padding:6px 0;transition:background .15s}
.m .rh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;min-height:22px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.line .h{text-align:right;overflow-wrap:anywhere}
.line .a{text-align:left;overflow-wrap:anywhere}
.line .win{font-weight:600}
.sc{font:italic 800 22px var(--display);background:var(--soft);border-radius:8px;padding:2px 12px;min-width:78px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap;transition:transform .2s}
.m:hover .sc{transform:scale(1.06)}
.sc.none{color:var(--muted)}
.empty{color:var(--muted);margin-top:6px}

/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}
.tc{display:block;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.tc:hover{transform:translateY(-4px)}
.tph,.hero,.pph,.mph{background:var(--soft);display:grid;place-items:center;overflow:hidden;--logo-wh:var(--soft)}
.tph{aspect-ratio:4/3;border-radius:14px;transition:box-shadow .3s}
.tc:hover .tph{box-shadow:var(--shadow)}
.tph img,.hero img,.pph img,.mph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tc:hover .tph img,.pc:hover .pph img{transform:scale(1.05)}
.emb{display:block;height:auto;opacity:.16}
.tph .emb{width:30%}
.tc h3{font:italic 800 20px/1.2 var(--display);margin-top:12px}
.tc p{color:var(--muted);font-size:13px;margin-top:2px}
.back{background:none;border:0;padding:0;color:var(--muted);font:500 14px var(--body);cursor:pointer;margin-bottom:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.thead h2{font:italic 800 clamp(30px,6vw,48px)/1.05 var(--display);overflow-wrap:anywhere}
.thead .sub{color:var(--muted);margin-top:8px}
.coach{display:flex;align-items:center;gap:12px;margin-top:14px}
.coach img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;box-shadow:0 0 0 2px var(--line)}
.coach small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.coach b{font-weight:600}
.hero{aspect-ratio:16/9;border-radius:16px;margin:22px 0 0}
.hero .emb{height:44%;width:auto}
.pedit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:16px 0 14px;margin-top:22px}
.stats div{text-align:center}
.stats b{display:block;font:italic 800 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.sec{margin-top:36px}
.sec h3{font:italic 800 26px/1 var(--display);margin-bottom:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h3 small{color:var(--muted);font:500 14px var(--body)}
.tmr{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tmr .mt{color:var(--muted);font-size:13px}
.tmr .op{overflow-wrap:anywhere}
.tmr .g{margin:0;min-width:64px;text-align:center;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.pc{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.pph{position:relative;aspect-ratio:3/4;border-radius:14px;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.pph img{object-position:center top}
.pph .emb{width:40%}
.pc:hover .pph{transform:translateY(-4px);box-shadow:var(--shadow)}
.pnum{position:absolute;left:8px;bottom:8px;min-width:34px;padding:1px 9px;background:var(--accent);color:var(--on-accent);font:italic 800 18px/1.4 var(--display);border-radius:9px;text-align:center}
.pc h4{font:600 15px/1.25 var(--body);margin-top:9px;overflow-wrap:anywhere}
.pc p{color:var(--muted);font-size:13px}
.panel{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}
.panel h3{font:italic 800 22px/1 var(--display);margin-bottom:14px}
.tm{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.tm li{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tm input{flex:1 1 180px;width:auto}

/* pop-up card */
.modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;overflow-y:auto;overscroll-behavior:contain;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal.fresh{animation:fade .2s ease both}
.sheet{position:relative;width:min(100%,400px);background:var(--bg);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin:auto}
.modal.fresh .sheet{animation:pop .34s cubic-bezier(.2,.9,.3,1.12) both}
.mph{aspect-ratio:3/4}
.mph.sm{aspect-ratio:auto;height:220px}
.mph .emb{width:34%}
.mph.sm .emb{height:50%;width:auto}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:2;transition:transform .2s}
.x:hover{transform:rotate(90deg)}
.pinfo{padding:18px 20px 22px;display:grid;gap:12px}
.pbig{display:flex;align-items:baseline;gap:14px}
.pbig .n{font:italic 800 46px/1 var(--display);color:var(--accent)}
.pbig h3{font:italic 800 25px/1.1 var(--display);overflow-wrap:anywhere}
.tline{color:var(--muted);font-size:13px}

/* forms and buttons */
.ed{border:1.5px solid var(--ink);border-radius:12px;padding:14px;margin:6px 0 10px;display:grid;gap:12px}
.fr{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.f.grow{flex:1 1 150px;min-width:0}
.sp{display:flex;align-items:center;gap:6px;color:var(--ink)}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;transition:border-color .2s}
input:hover,select:hover{border-color:var(--muted)}
input.num{width:62px;text-align:center}
input.year{width:96px}
input.time{width:90px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:600 14px var(--body);border-radius:9px;padding:9px 16px;border:1.5px solid var(--btn);background:var(--btn);color:var(--on-btn);cursor:pointer;transition:transform .15s,opacity .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--loss);border-color:var(--loss)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.lnk{background:none;border:0;color:var(--ink);font:600 12px var(--body);cursor:pointer;padding:2px 0;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-transform:none;letter-spacing:0}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);color:var(--bar-fg);
  display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar.fresh{animation:slide .35s cubic-bezier(.2,.7,.2,1) both}
.savebar span{font-size:14px}
.savebar .row{display:flex;gap:8px}
.savebar .btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.savebar .btn.ghost{background:transparent;color:var(--bar-fg);border-color:var(--bar-fg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;animation:pop .3s cubic-bezier(.2,.9,.3,1.12) both}

@media (max-width:560px){
  .c-gd{display:none}
  .logo{height:44px}
  .lg{font-size:26px}
  .stats b{font-size:21px}
  .stats span{font-size:10px;letter-spacing:.05em}
  .tmr{grid-template-columns:84px minmax(0,1fr) auto}
  .slot{grid-template-columns:54px minmax(0,1fr)}
  .sc{min-width:68px;padding:2px 8px}
}
@media (prefers-reduced-motion:reduce){
  .rv,.modal.fresh,.modal.fresh .sheet,.savebar.fresh,#toast{animation:none!important}
  .tc,.pph,.tph,.tc img,.pph img,.sc,.btn,.x,.lg::after{transition:none!important}
}

/* sections */
.snav{display:flex;gap:4px 18px;flex-wrap:wrap;margin-top:18px;align-items:center}
.sn{background:none;border:0;padding:4px 0;font:700 13px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.sn:hover{color:var(--ink)}
.sn[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.next{margin-left:auto;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:5px 14px;font:600 12px var(--body);cursor:pointer;transition:transform .2s}
.next:hover{transform:translateY(-1px)}
.sec-h{font:italic 800 34px/1.1 var(--display);margin:26px 0 4px}
.day{margin:26px 0 34px}
.day.past{opacity:.6}
.day h3{font:italic 800 28px/1.1 var(--display)}
.day .wd{color:var(--muted);font-size:13px;margin:4px 0 10px}
.badge{display:inline-block;background:var(--soft);border-radius:3px;padding:1px 9px;font-size:11px;letter-spacing:.04em;margin-left:8px;text-transform:none}
.se{width:30px;height:30px;object-fit:contain;vertical-align:middle;border-radius:0;background:none}
.line .h .se{margin-left:10px}
.line .a .se{margin-right:10px}
.sc.vs{font:700 22px var(--display);font-style:normal;background:none;border-radius:0;padding:0;min-width:18px;color:#FF8302;letter-spacing:0}
.photos{columns:2 220px;column-gap:14px}
.ph{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:var(--soft);border-radius:12px;overflow:hidden;cursor:pointer;break-inside:avoid;position:relative;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.ph:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ph img{display:block;width:100%;height:auto}
.ph .cp{display:block;text-align:left;padding:8px 12px;font-size:13px;color:var(--ink);background:var(--bg)}
.lbs{max-width:min(960px,96vw);padding:14px}
.lbs img{display:block;max-width:100%;max-height:76vh;margin:0 auto;border-radius:8px}
.lbs p{margin:10px 2px 0;font-size:14px}
.vids{display:grid;gap:8px;margin:10px 0 24px}
.vid{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;transition:border-color .2s,transform .2s}
.vid:hover{border-color:var(--accent);transform:translateY(-2px)}
.vid i{font-style:normal;color:var(--accent)}
.rm{background:none;border:0;color:var(--loss);font-size:12px;cursor:pointer;padding:4px 0}
.sform{border:1.5px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0 16px;display:grid;gap:10px}
.soc{display:flex;gap:8px;margin-left:auto;align-items:center}
.soc a,.soc button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font:600 12px var(--body);color:var(--ink);text-decoration:none;background:none;cursor:pointer;transition:border-color .2s,transform .2s}
.soc a:hover,.soc button:hover{border-color:var(--accent);transform:translateY(-1px)}
.soc svg{width:14px;height:14px;fill:none;stroke:var(--accent);stroke-width:2}
.next+.soc{margin-left:8px}
textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:150px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body{background:radial-gradient(1100px 420px at 50% -120px,rgba(255,131,2,.13),transparent 70%) no-repeat,var(--bg)}
.hero2{margin:34px 0 8px}
.hero2 h1{font:italic 800 clamp(30px,7vw,52px)/1.05 var(--display)}
.hero2 h1 em{font-style:italic;color:var(--accent)}
.hero2 p{color:var(--muted);margin-top:10px;font-size:16px;max-width:52ch}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:22px 0 6px}

/* ---------- data helpers ---------- */
function standings(L) {
  const P = L.pts || { w: 3, d: 1, l: 0 };
  const rows = new Map(L.teams.map(t => [t, { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, gd: 0 }]));
  for (const tour of L.tours) for (const m of tour.matches) {
    if (!played(m)) continue;
    const h = rows.get(m.h), a = rows.get(m.a);
    if (!h || !a) continue;
    h.p++; a.p++;
    h.gf += m.hg; h.ga += m.ag; a.gf += m.ag; a.ga += m.hg;
    if (m.hg > m.ag) { h.w++; a.l++; h.pts += P.w; a.pts += P.l; }
    else if (m.hg < m.ag) { a.w++; h.l++; a.pts += P.w; h.pts += P.l; }
    else { h.d++; a.d++; h.pts += P.d; a.pts += P.d; }
  }
  const arr = [...rows.values()];
  arr.forEach(r => { r.gd = r.gf - r.ga; });
  arr.sort((x, y) => (y.p > 0) - (x.p > 0) || y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.localeCompare(y.team, 'ru'));
  return arr;
}
function rankMap(L) {
  const m = new Map();
  let prev = '', place = 0;
  standings(L).forEach((r, i) => {
    const key = r.pts + '|' + r.gd + '|' + r.gf;
    if (key !== prev) { place = i + 1; prev = key; }
    m.set(r.team, Object.assign({ place: r.p ? place : null, idx: i }, r));
  });
  return m;
}
function pairGames(L, a, b) {
  const out = [];
  for (const t of L.tours) for (const m of t.matches) {
    if (!played(m)) continue;
    if (m.h === a && m.a === b) out.push([m.hg, m.ag]);
    else if (m.h === b && m.a === a) out.push([m.ag, m.hg]);
  }
  return out;
}
function usage(L, team) {
  let n = 0;

function layoutText(ctx, text, maxW, size, font) {
  const lo = Math.max(12, size * 0.6);
  for (let sz = size; sz >= lo; sz -= 1) {
    ctx.font = font(sz);
    if (ctx.measureText(String(text)).width <= maxW) return { t: String(text), size: sz };
  }
  ctx.font = font(lo);
  let t = String(text);
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return { t: t + '…', size: lo };
}
const fDisp = sz => 'italic 800 ' + sz + 'px "Exo 2", Arial, sans-serif';
const fBody = (sz, w) => (w || 500) + ' ' + sz + 'px "Golos Text", Arial, sans-serif';

}
function loadLogo() {
  return new Promise((resolve, reject) => {

    const inner = m[0].replace(/var\(--logo-nv\)/g, '#FFFFFF').replace(/var\(--logo-wh\)/g, '#010F26');
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + LOGO_VB + '">' + inner + '<use href="#jl-emb"/><use href="#jl-word"/></svg>';

}
async function makePoster(title, sub, contentH, draw) {
  try { if (document.fonts && document.fonts.load) await Promise.all([document.fonts.load('italic 800 40px "Exo 2"'), document.fonts.load('600 24px "Golos Text"')]); } catch (e) { /* fonts are optional */ }

  x.textBaseline = 'alphabetic'; x.textAlign = 'left';

async function schedulePoster(d) {

  const gs = d.games.slice().sort((a, b) => (a.t || '99:99').localeCompare(b.t || '99:99') || (a.f || 99) - (b.f || 99));
  const times = [], rows = {};

    const k = g.t || '';
    if (!rows[k]) { rows[k] = []; times.push(k); }

  }
  const placed = [];

    for (const g of gs.filter(q => (q.t || '') === k)) {

    }

  }
  const ems = {};
  await Promise.all(gs.flatMap(g => [[g.l, g.h], [g.l, g.a]]).map(async ([l, n]) => { const e = emOf(l, n); if (e && !ems[l + '|' + n]) ems[l + '|' + n] = await loadImg(/^data:image\//.test(e) ? e : '/_blob/' + e); }));
  const drawEm = (x, lid, n, bx, by, s) => { const im = ems[lid + '|' + n]; if (!im) return; const k = Math.min(s / im.width, s / im.height); x.drawImage(im, bx + (s - im.width * k) / 2, by + (s - im.height * k) / 2, im.width * k, im.height * k); };
  const rowH = 170, gap = 14, headH = 56;
  const title = dayTitle(d.date) + (p ? ', ' + p.wd : '');
  const sub = d.note || 'Расписание игр';

    const left = 56 + 150, cw = (W - 112 - 150 - (nF - 1) * gap) / nF;

    let U = 30;
    for (const row of placed) for (const [, g] of row[1]) for (const nm of [g.h, g.a]) U = Math.min(U, layoutText(x, nm, cw - 92, 30, sz => fBody(sz, 700)).size);
    placed.forEach((row, ri2) => {
      const y = y0 + headH + ri2 * (rowH + gap);
      x.fillStyle = '#FF8302'; x.font = fDisp(46); x.textAlign = 'left'; x.fillText(row[0] || '–', 56, y + 92);
      for (const [col, g] of row[1]) {
        const cx = left + col * (cw + gap);
        x.fillStyle = '#0A2249'; x.fillRect(cx, y, cw, rowH);
        x.strokeStyle = '#15305A'; x.lineWidth = 2; x.strokeRect(cx, y, cw, rowH);
        x.fillStyle = '#FF8302'; x.font = fBody(19, 600); x.textAlign = 'left'; x.fillText(leagueName(g.l).toUpperCase(), cx + 18, y + 34);
        const h = layoutText(x, g.h, cw - 92, U, sz => fBody(sz, 700)); x.fillStyle = '#FFFFFF'; x.font = fBody(h.size, 700); x.fillText(h.t, cx + 18, y + 80); drawEm(x, g.l, g.h, cx + cw - 64, y + 42, 46);
        x.fillStyle = '#9BAAC4'; x.font = fBody(20); x.fillText('–', cx + 18, y + 108);
        const a = layoutText(x, g.a, cw - 92, U, sz => fBody(sz, 700)); x.fillStyle = '#FFFFFF'; x.font = fBody(a.size, 700); x.fillText(a.t, cx + 18, y + 146); drawEm(x, g.l, g.a, cx + cw - 64, y + 108, 46);

}

    x.fillStyle = '#9BAAC4'; x.font = fBody(20, 600); x.textAlign = 'right';
    for (const c of cols) x.fillText(c[0], c[1], y0 + 30);
    x.textAlign = 'left'; x.fillText('КОМАНДА', 116, y0 + 30);
    rows.forEach((r, i) => {
      const y = y0 + 52 + i * rowH, k = rk.get(r.team), lead = r.p > 0 && k.place === 1;
      if (i % 2 === 0) { x.fillStyle = 'rgba(10,34,73,0.8)'; rrect(x, 40, y, 1000, rowH - 6, 14); x.fill(); }
      const cy = y + (rowH - 6) / 2;
      x.beginPath(); x.arc(84, cy, 21, 0, Math.PI * 2); x.fillStyle = lead ? '#FF8302' : '#15305A'; x.fill();
      x.fillStyle = lead ? '#011D42' : '#FFFFFF'; x.font = fDisp(24); x.textAlign = 'center'; x.fillText(r.p ? String(k.place) : '–', 84, cy + 9);
      const ex = 140, er = 24;
      if (ems[r.team]) { { const im = ems[r.team], k = Math.min(er * 2 / im.width, er * 2 / im.height); x.save(); x.drawImage(im, ex - im.width * k / 2, cy - im.height * k / 2, im.width * k, im.height * k); x.restore(); } }
      else { x.beginPath(); x.arc(ex, cy, er, 0, Math.PI * 2); x.strokeStyle = '#15305A'; x.lineWidth = 3; x.stroke(); }
      const nm = layoutText(x, r.team, 390, 30, sz => fBody(sz, 600)); x.fillStyle = '#FFFFFF'; x.font = fBody(nm.size, 600); x.textAlign = 'left'; x.fillText(nm.t, 180, cy + 10);
      x.font = fBody(26); x.textAlign = 'right';
      const vals = [r.p, r.w, r.d, r.l, r.gf + '–' + r.ga, (r.gd > 0 ? '+' : '') + r.gd];
      x.fillStyle = '#E3E9F2';
      vals.forEach((v, j) => x.fillText(String(v), cols[j][1], cy + 9));
      x.fillStyle = '#FF8302'; x.font = fDisp(34); x.fillText(String(r.pts), 1024, cy + 12);
    });
    x.textAlign = 'left';
  });
}
async function saveCanvas(c, name) {
  try {
    const d = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!d) throw { code: 'unavailable' };
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
    await d.save({ filename: name, data: blob });
    toast('Файл сохранён');
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast('Не удалось скачать файл. Попробуйте ещё раз.');
  }
}

function saveForm() {

  if (t) {

    if (!mm || +mm[1] > 23 || +mm[2] > 59) return fail('Время укажите как 16:00');

  if (hg !== '' && !(/^\d{1,2}$/.test(hg) && /^\d{1,2}$/.test(ag))) return fail('Счёт должен быть целым числом');
  const rec = { t: t, f: f ? +f : null, h: h, a: a, hg: hg === '' ? null : +hg, ag: ag === '' ? null : +ag };
  const key = form.dataset.form;
  if (key.indexOf('new:') === 0) {
    const tour = L.tours.find(x => x.n === +key.slice(4));
    tour.matches.push(Object.assign({ id: newId('m') }, rec));

function toJpeg(file, max, png) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        const ctx = c.getContext('2d');
        if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }

      t = ('0' + mm[1]).slice(-2) + ':' + mm[2];
    }
    if (f && !/^[1-9]\d?$/.test(f)) return toast('Номер поля должен быть числом');
    d.games.push({ id: newId('g'), t: t, f: f ? +f : null, l: v('sg-l'), h: h, a: a });
    ui.addGame = { day: d.id, l: v('sg-l'), t: t, f: f }; render(); return toast('Игра добавлена в черновик');
  }
  if (act === 'delgame') {
    if (ui.confirm !== 'g:' + b.dataset.id) { ui.confirm = 'g:' + b.dataset.id; return render(); }
    for (const d of state.schedule) d.games = d.games.filter(g => g.id !== b.dataset.id);
    ui.confirm = null; render(); return toast('Игра убрана из черновика');
  }
  if (act === 'delphoto') {
    if (ui.confirm !== 'ph:' + b.dataset.id) { ui.confirm = 'ph:' + b.dataset.id; return render(); }
    state.media.photos = state.media.photos.filter(p => p.id !== b.dataset.id); ui.confirm = null; render(); return toast('Фото убрано из черновика');
  }
  if (act === 'addalbum') { ui.addAlbum = true; render(); return focusEl('ma-title'); }
  if (act === 'cancelalbum') { ui.addAlbum = false; return render(); }
  if (act === 'savealbum') {
    const title = document.getElementById('ma-title').value.trim(), url = document.getElementById('ma-url').value.trim();
    if (!title) return toast('Введите название альбома');
    if (!okUrl(url)) return toast('Вставьте ссылку, начинающуюся с https://');
    const ad = document.getElementById('ma-date').value; state.media.albums.push({ id: newId('al'), title: title, url: url, date: /^\d{4}-\d{2}-\d{2}$/.test(ad) ? ad : '' }); ui.addAlbum = false; render(); return toast('Альбом в черновике. Нажмите «Опубликовать».');
  }
  if (act === 'delalbum') { state.media.albums = state.media.albums.filter(v => v.id !== b.dataset.id); render(); return toast('Альбом убран из черновика'); }
  if (act === 'addvideo') { ui.addVideo = true; render(); return focusEl('mv-title'); }
  if (act === 'cancelvideo') { ui.addVideo = false; return render(); }
  if (act === 'savevideo') {
    const title = document.getElementById('mv-title').value.trim(), url = document.getElementById('mv-url').value.trim();
    if (!/^https?:\/\/\S+$/i.test(url)) return toast('Вставьте ссылку, начинающуюся с https://');
    state.media.videos.push({ id: newId('v'), title: title, url: url }); ui.addVideo = false; render(); return toast('Видео в черновике');
  }
  if (act === 'delvideo') { state.media.videos = state.media.videos.filter(v => v.id !== b.dataset.id); render(); return toast('Видео убрано из черновика'); }
  if (act === 'discard') {
    { const o = JSON.parse(original); state.leagues = o.leagues; state.schedule = o.schedule || []; state.media = o.media || { photos: [], videos: [] }; state.links = o.links || { vk: '', ig: '' }; state.articles = o.articles || []; state.stars = o.stars || []; state.sponsors = o.sponsors || []; state.venue = o.venue || { plan: null, pins: [] }; ui.pinForm = null; ui.pinMode = null; state.contacts = o.contacts || { place: '', address: '', phone: '', hours: '' }; ui.sponsorForm = null; ui.editContacts = false; ui.starForm = null; ui.artForm = null; ui.editLinks = false; }
    ui.editing = null; ui.adding = null; ui.confirm = null; ui.modal = null; ui.addGame = null; ui.addDay = false; ui.addVideo = false;
    render(); return toast('Правки отменены');
  }
  if (act === 'publish') return publish();
});

  } else if (act === 'splogo2') {

  } else if (act === 'splogo') {

    const f = ui.sponsorForm; const n = document.getElementById('sp-name'), u = document.getElementById('sp-url');
    if (n) f.name = n.value; if (u) f.url = u.value;
    const id = await doUpload(file, 600, true);

  } else if (act === 'sphoto') {

    captureStar();
    const id = await doUpload(file, 1000);
    if (id && ui.starForm) { ui.starForm.photo = id; render(); toast('Фото добавлено'); }
  } else if (act === 'apic') {
    if (!ui.artForm) return;
    captureArt();
    const id = await doUpload(file, 1600);
    if (id && ui.artForm) { ui.artForm.photo = id; render(); toast('Фото добавлено к статье'); }
  } else if (act === 'mphoto') {
    let n = 0;
    for (const f of Array.from(t.files)) {
      const id = await doUpload(f, 1600);
      if (id) { state.media.photos.push({ id: newId('f'), photo: id, cap: '' }); n++; }

    if (n) { render(); toast(n + ' ' + pl(n, 'фото', 'фото', 'фото') + ' в черновике. Нажмите «Опубликовать».'); }
  } else if (act === 'pphoto') {

});


// ---- live results from a published Google Sheet (standalone site only) ----
const CFG = window.JL_CONFIG || {};
function parseCsv(t) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function applySheet(text) {
  const tm = CFG.tours || { '2015/16': 2, '2018/19': 3, '2020/21': 2 };
  let ch = false;
  parseCsv(text).slice(1).forEach(r => {
    const L = state.leagues.find(l => l.name === (r[2] || '').trim());
    const sc = /^\s*(\d+)\s*[:\-–]\s*(\d+)\s*$/.exec(r[6] || '');
    if (!L || !sc) return;
    const h = (r[4] || '').trim(), a = (r[5] || '').trim();
    if (!L.teams.includes(h) || !L.teams.includes(a)) return;
    const n = tm[L.name] || 1;
    let T = L.tours.find(t => t.n === n);
    if (!T) { T = { n: n, matches: [] }; L.tours.push(T); ch = true; }
    const hg = +sc[1], ag = +sc[2];
    const x = T.matches.find(y => y.h === h && y.a === a);
    if (x) { if (x.hg !== hg || x.ag !== ag) { x.hg = hg; x.ag = ag; ch = true; } }
    else { T.matches.push({ id: 's' + n + T.matches.length + h.length, t: (r[1] || '').trim(), f: null, h: h, a: a, hg: hg, ag: ag }); ch = true; }
  });
  return ch;
}
async function pullSheet() {
  if (!CFG.sheetCsv || document.hidden || ui.modal) return;
  const urls = [].concat(CFG.sheetCsv);
  for (const u of urls) {
    try {
      const r = await fetch(u + (u.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) continue;
      const txt = await r.text();
      if (txt.indexOf('<html') >= 0) continue;
      if (applySheet(txt)) render();
      return;
    } catch (x) { /* try next source */ }
  }
}

(function init() {
  const p = parseHash();
  if (p && p.sec) ui.sec = p.sec;
  else if (p) { ui.sec = 'league'; ui.league = p.l; ui.view = p.v; ui.team = p.t; if (p.pid) { ui.modal = { tid: p.t, pid: p.pid, edit: false }; ui.modalFresh = true; } }
  render(true);
  if (CFG.sheetCsv) { pullSheet(); setInterval(pullSheet, 30000); }
  const c = window.claude;
  if (c && c.use) {
    c.use('downloads').then(d => { if (d) { canDl = true; render(); } }).catch(() => {});
    Promise.all([
      c.use('user').then(u => u ? u.canEdit() : false),
      c.use('assets').then(a => !!a).catch(() => false),
    ]).then(r => { if (r[0]) { canEdit = true; canUpload = r[1]; render(); } }).catch(() => {});
  }
})();
})();
